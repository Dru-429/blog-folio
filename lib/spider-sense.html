<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spider-Sense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--bg:#e7e7e4;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b}}
:root[data-theme="dark"]{--bg:#0b0b0b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg)}
body{margin:0;padding:0;overflow:hidden;background:transparent}
.wrap{width:100%}
.tear{position:relative;container-type:inline-size;aspect-ratio:2.44/1;margin-top:64px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#1b1b1b,#0a0a0a 75%);border-radius:4px}
.tear .big{position:absolute;left:-.5cqw;top:50%;transform:translateY(-50%);z-index:0;font-family:"Archivo Black",Impact,"Arial Black",sans-serif;font-weight:900;font-size:min(10vw,92px);font-size:10.4cqw;line-height:1;letter-spacing:0;white-space:nowrap;color:#ececec;user-select:none}
.tear .spk{position:absolute;right:2.5cqw;top:38%;width:24cqw;z-index:2;transform:scale(calc(1 + var(--i,0)*.3));transform-origin:center;pointer-events:none}
.tear .spk .r{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.tear .spk .r:nth-child(2){animation-duration:9s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.tear .strip{position:absolute;left:-1%;right:-1%;z-index:1;filter:drop-shadow(0 5px 7px rgba(0,0,0,.5));pointer-events:none}
.tear .strip.top{top:0;height:24%}
.tear .strip.bot{bottom:0;height:26%;z-index:4}
.tear .strip i{position:absolute;inset:0}
.tear .fib{background:#f7f7f7}
.tear .fig{position:absolute;height:113%;aspect-ratio:856/826;left:50%;top:0;transform:translateX(-50%);z-index:3}
.tear .head{position:absolute;inset:0;transform-origin:50% 62%;pointer-events:none}
.tear .head>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.tear .head>.ol{filter:drop-shadow(0 4px 9px rgba(0,0,0,.55))}
.tear .eyes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.tear .bolts{position:absolute;inset:0;z-index:4;pointer-events:none}
.tear .bolts img{position:absolute;opacity:0;will-change:transform,opacity}
.tear .face{position:absolute;border-radius:50%;z-index:5}
.tear .pap{background-color:#f4f2ec;background-image:linear-gradient(90deg,transparent 6.5cqw,rgba(214,76,76,.55) 6.5cqw,rgba(214,76,76,.55) calc(6.5cqw + 1.5px),transparent calc(6.5cqw + 1.5px)),repeating-linear-gradient(180deg,transparent 0,transparent calc(3.4cqw - 1.5px),#a9bfdc calc(3.4cqw - 1.5px),#a9bfdc 3.4cqw)}
.wrap .tear{margin-top:0}

:root { --sense-paper: oklch(0.975 0.008 85); --sense-rule: oklch(0.72 0.04 240 / 0.55); --sense-margin: oklch(0.35 0.01 260 / 0.7); --sense-backdrop: oklch(0.14 0 0); --sense-fiber: oklch(0.98 0 0); --sense-type: oklch(0.94 0 0); }
html,body { background:transparent; }
.tear { margin:0; background:var(--sense-backdrop); }
.tear .big { color:var(--sense-type); }
.tear .fib { background:color-mix(in oklch, var(--sense-paper) 85%, var(--sense-fiber)); }
.tear .pap { background:var(--sense-paper); }
.tear .pap::before,.tear .pap::after { content:"";position:absolute;inset:0;transition:transform 650ms ease; }
.tear .pap::before { transform-origin:left;background-image:linear-gradient(180deg,transparent calc(100% - 1.5px),var(--sense-rule) calc(100% - 1.5px));background-size:100% var(--sense-line,36px);background-repeat:repeat-y;background-position-y:var(--sense-rule-offset,0px); }
.tear .pap::after { display:none; }
:root[data-mono="true"] .pap::before { transform:scaleX(0); }
:root[data-mono="true"] .pap::after { transform:scaleY(0); }
.face { cursor:pointer; }
.face:focus-visible { outline:2px dashed var(--sense-type);outline-offset:5px; }
@media(prefers-reduced-motion:reduce) { .tear .spk .r { animation:none; } .tear .pap::before,.tear .pap::after { transition:none; } }
</style>
</head>
<body>
<div class="wrap">
<section class="tear" id="tear" aria-label="Spider-sense">
  <div class="big">SPIDER-SENSE</div>
  <svg class="spk" id="spk" viewBox="0 0 220 60" aria-hidden="true"></svg>
  <div class="strip top" aria-hidden="true"><i class="fib"></i><i class="pap"></i></div>
  <div class="fig" id="fig">
    <div class="head" id="head"><img class="ol" id="ol" alt=""><img id="hd" alt="Spider-Man"><svg class="eyes" id="eyes" aria-hidden="true"></svg></div>
    <div class="bolts" id="bolts"></div>
    <div class="face" id="face" role="button" tabindex="0" aria-label="Change Spider-Man expression"></div>
  </div>
  <div class="strip bot" aria-hidden="true"><i class="fib"></i><i class="pap"></i></div>
</section>
</div>
<script>
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
// ---- torn-paper section: lenses morph between expressions, look at the cursor, spider-sense tingles with proximity
(function(){
const T={"W": 856, "H": 826, "head": "/__l5e/assets-v1/5a2afef7-50b1-4faf-ba85-7a73e0cd9cf6/sense-0.webp", "outline": "/__l5e/assets-v1/03bbff11-0d37-46da-a97f-d3c852c52fde/sense-1.png", "eyes": [{"cx": 355.0191250824357, "cy": 336.15717740162677, "rx": 49.558811394506456, "ry": 29.950762653110097, "ang": 43.894469756830915, "sock": "M306 263L301 297L293 297L293 278L289 296L289 330L297 359L294 346L294 323L301 324L307 354L316 370L329 382L341 389L357 394L370 394L383 390L401 375L415 353L415 347L410 336L400 321L384 305L349 278L331 261L321 259Z"}, {"cx": 500.657993384785, "cy": 336.1753031973539, "rx": 49.46472233877803, "ry": 29.918299745294963, "ang": -43.896895786232534, "sock": "M550 263L535 259L524 261L507 278L475 302L453 325L443 341L441 353L448 366L465 385L486 394L504 393L519 387L533 377L542 367L551 348L555 329L562 330L562 345L559 359L566 335L566 289L562 275L562 289L554 289Z"}], "bolts": [{"src": "/__l5e/assets-v1/17dc332f-ca98-4ce8-ac9e-a837e04f001d/sense-2.png", "x": 0.46448598130841123, "y": -0.005326876513317198, "w": 0.07102803738317758, "cx": 0.5, "cy": 0.0774818401937046}, {"src": "/__l5e/assets-v1/131a8774-2ab5-4085-9d4d-96ab7434b3e3/sense-3.png", "x": 0.644626168224299, "y": 0.056658595641646485, "w": 0.11962616822429907, "cx": 0.7044392523364486, "cy": 0.13317191283292978}, {"src": "/__l5e/assets-v1/f6d69c8d-935b-44e0-a065-974f7278ea83/sense-4.png", "x": 0.2366822429906542, "y": 0.07869249394673124, "w": 0.1177570093457944, "cx": 0.2955607476635514, "cy": 0.13922518159806296}, {"src": "/__l5e/assets-v1/58572913-fe22-47c1-82fc-f93e92200e4e/sense-5.png", "x": 0.7254672897196262, "y": 0.23462469733656174, "w": 0.14485981308411214, "cx": 0.7978971962616822, "cy": 0.27239709443099275}, {"src": "/__l5e/assets-v1/f38df405-6f2f-48ef-b5b8-6deaec684ee6/sense-6.png", "x": 0.13574766355140186, "y": 0.2532687651331719, "w": 0.13271028037383178, "cx": 0.20210280373831777, "cy": 0.29055690072639223}, {"src": "/__l5e/assets-v1/f966d822-c7b7-40da-a2ef-3af9f44804ab/sense-7.png", "x": 0.7827102803738317, "y": 0.3581113801452785, "w": 0.13551401869158877, "cx": 0.8504672897196262, "cy": 0.40556900726392253}, {"src": "/__l5e/assets-v1/dc87021b-f8d1-496c-81f2-a53c044818fe/sense-8.png", "x": 0.07570093457943924, "y": 0.36561743341404357, "w": 0.12429906542056075, "cx": 0.1378504672897196, "cy": 0.423728813559322}], "face": [0.5, 0.4043583535108959, 0.169392523364486, 0.2566585956416465]},$=id=>document.getElementById(id),fig=$('fig'),head=$('head'),bl=$('bolts'),svg=$('eyes'),spk=$('spk'),face=$('face');
T.fc=[T.face[0],T.face[1]];T.fr=[T.face[2],T.face[3]];
face.style.cssText='left:'+(T.face[0]-T.face[2])*100+'%;top:'+(T.face[1]-T.face[3])*100+'%;width:'+T.face[2]*200+'%;height:'+T.face[3]*200+'%';
$('ol').src=T.outline;$('hd').src=T.head;
// torn edges
let sd=7;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
const edge=(n,b,a)=>{const o=[];let w=0;for(let i=0;i<=n;i++){w=(w+(rnd()-.5)*a*.9)*.82;o.push(b+w+(rnd()-.5)*a*.7)}return o};
const poly=(a,top)=>{const n=a.length-1,p=a.map((y,i)=>(i/n*100).toFixed(1)+'% '+y.toFixed(1)+'%');return top?'polygon(0 0,100% 0,'+p.reverse().join(',')+')':'polygon('+p.join(',')+',100% 100%,0 100%)'};
document.querySelectorAll('.tear .strip').forEach(s=>{const top=s.classList.contains('top'),pap=edge(46,top?68:34,9),fib=pap.map(y=>y+(top?1:-1)*(4+rnd()*5));s.querySelector('.pap').style.clipPath=poly(pap,top);s.querySelector('.fib').style.clipPath=poly(fib,top)});
// sparkles on the right
const star=(cx,cy,R,r,n)=>Array.from({length:2*n},(_,i)=>{const a=i*Math.PI/n,q=i%2?r:R;return(cx+Math.sin(a)*q).toFixed(1)+','+(cy-Math.cos(a)*q).toFixed(1)}).join(' ');
spk.innerHTML='<g class="r"><polygon points="'+star(30,30,29,14,8)+'" fill="var(--sense-type)"/></g><g class="r"><path d="M110 0Q110 30 140 30Q110 30 110 60Q110 30 80 30Q110 30 110 0Z" fill="var(--sense-type)"/></g><g class="r" fill="var(--sense-type)"><circle cx="181" cy="30" r="12"/><circle cx="199" cy="30" r="12"/><circle cx="190" cy="21" r="12"/><circle cx="190" cy="39" r="12"/></g>';
const B=T.bolts.map(b=>{const i=new Image();i.src=b.src;i.alt='';i.style.cssText='left:'+b.x*100+'%;top:'+b.y*100+'%;width:'+b.w*100+'%';bl.appendChild(i);return i});
// expressions, after the sheet: wide, wary, sleepy, cross, cat-squint, happy, puzzled
const X={neutral:{sx:1,sy:1,top:0,slant:0,bot:0,curve:0},
 alert:{sx:1.03,sy:1.1,top:.1,slant:.22,bot:.08,curve:0},
 shocked:{sx:1.12,sy:1.24,top:0,slant:0,bot:0,curve:0},
 sleepy:{sx:1,sy:1,top:.52,slant:0,bot:.04,curve:0},
 angry:{sx:1,sy:1,top:.2,slant:.55,bot:.12,curve:0},
 squint:{sx:1.08,sy:1,top:.34,slant:.12,bot:.4,curve:.1},
 happy:{sx:1,sy:.95,top:.04,slant:0,bot:.5,curve:.9},
 confused:[{sx:1,sy:1.12,top:0,slant:-.12,bot:0,curve:0},{sx:1,sy:.85,top:.28,slant:.35,bot:.05,curve:0}],
 curious:{sx:.92,sy:1,top:.12,slant:-.2,bot:.05,curve:0}};
const CL=['happy','angry','squint','confused','curious','sleepy'];
const mixp=(a,b,w)=>{const o={};for(const k in a)o[k]=a[k]+(b[k]-a[k])*w;return o};
const pick=(n,k)=>Array.isArray(X[n])?X[n][k]:X[n];
// lens eyes (svg): lens ellipse, clipped by a top lid line and a bottom lid curve, with black outlines
svg.setAttribute('viewBox','0 0 '+T.W+' '+T.H);svg.setAttribute('preserveAspectRatio','none');
const NS='http://www.w3.org/2000/svg',mk=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e};
const defs=mk('defs'),gr=mk('radialGradient',{id:'lg',cx:'40%',cy:'35%',r:'75%'},defs);
mk('stop',{offset:0,'stop-color':'#fff'},gr);mk('stop',{offset:.55,'stop-color':'#e3effb'},gr);mk('stop',{offset:1,'stop-color':'#a9c8ea'},gr);
const E=T.eyes.map((e,k)=>{
  const og=mk('g',{}),ck=mk('clipPath',{id:'sk'+k},defs);mk('path',{d:e.sock},ck);og.setAttribute('clip-path','url(#sk'+k+')');
  const g=mk('g',{transform:'translate('+e.cx+' '+e.cy+') rotate('+e.ang+')'},og),cL=mk('clipPath',{id:'cL'+k},defs),cLp=mk('path',{},cL),
   fill=mk('ellipse',{fill:'var(--sense-type)','clip-path':'url(#cL'+k+')'},g);
  return{e,cLp,fill,inner:k?-1:1,p:{...X.neutral},ox:0,oy:0}});
// the lens: an ellipse inside the black eye frame, cut by a top lid line and a bottom lid curve
function setEye(Q,p,bl){
  const e=Q.e,rx=e.rx*1.1,ry=e.ry*1.1,L=rx*1.9,s=Math.tan(p.slant)*Q.inner,a=e.ang*Math.PI/180;
  const yb=x=>ry-2*ry*p.bot-p.curve*ry*(1-(x/rx)*(x/rx)),tp=Math.min(Math.max(p.top,bl*.97),(yb(0)+ry)/(2*ry)-.03);
  const yt=x=>-ry+2*ry*tp+s*x,b0=yb(-L),b1=yb(L),c=2*yb(0)-.5*(b0+b1),f=Q.fill;
  f.setAttribute('cx',Q.ox*Math.cos(a)+Q.oy*Math.sin(a));f.setAttribute('cy',-Q.ox*Math.sin(a)+Q.oy*Math.cos(a));f.setAttribute('rx',rx*p.sx);f.setAttribute('ry',ry*p.sy);
  Q.cLp.setAttribute('d','M'+-L+' '+yt(-L)+'L'+L+' '+yt(L)+'L'+L+' '+b1+'Q0 '+c+' '+-L+' '+b0+'Z');
}
const h=(a,b)=>{const x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x)};
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let mx=-1e4,my=-1e4,I=0,burst=-1e4,hx=0,hy=0,last=0,ci=-1,cu=0,nb=2500,b0=-1e4;
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;last=performance.now()});
addEventListener('pointerdown',e=>{mx=e.clientX;my=e.clientY;last=performance.now();if(e.target.closest&&e.target.closest('#face')){burst=last;ci=(ci+1)%CL.length;cu=last+1700}});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
face.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();burst=performance.now();ci=(ci+1)%CL.length;cu=burst+1700}});
addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='spider-sense-theme')return;for(const [key,value] of Object.entries(e.data.colors||{})){if(['paper','rule','margin'].includes(key)&&typeof value==='string')document.documentElement.style.setProperty('--sense-'+key,value)}if(Number.isFinite(e.data.line)&&e.data.line>0){document.documentElement.style.setProperty('--sense-line',e.data.line+'px');document.querySelectorAll('.strip').forEach(s=>s.style.setProperty('--sense-rule-offset',-(e.data.offset+s.offsetTop)+'px'))}document.documentElement.dataset.mono=String(e.data.mono)});
function loop(t){
  requestAnimationFrame(loop);
  const r=fig.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;
  const fx=r.left+T.fc[0]*r.width,fy=r.top+T.fc[1]*r.height,rx=T.fr[0]*r.width,ry=T.fr[1]*r.height;
  const e=Math.hypot((mx-fx)/rx,(my-fy)/ry);              // 1 = edge of the face
  const b=t-burst<700;let tg=e<1?1:e<2.3?.15+.6*(1-(e-1)/1.3):0;if(b)tg=1;
  I+=(tg-I)*(tg>I?.25:.08);
  // pick the expression, morph the lenses toward it, blink now and then
  if(t>nb){b0=t;nb=t+2400+Math.random()*3600}
  const bl_=!reduced&&t-b0<170?Math.sin(Math.PI*(t-b0)/170):0;
  E.forEach((Q,k)=>{
    let want=t<cu?pick(CL[ci],k):I>.92?X.shocked:I>.12?mixp(X.neutral,X.alert,sm(.12,.7,I)):t-last>9000?X.sleepy:X.neutral;
    for(const q in want)Q.p[q]+=(want[q]-Q.p[q])*.18;
    const ex=r.left+Q.e.cx/T.W*r.width,ey=r.top+Q.e.cy/T.H*r.height,dx=mx-ex,dy=my-ey,d=Math.hypot(dx,dy)||1,s=Math.min(1,d/260);
    Q.ox+=(dx/d*s*Q.e.ry*.7-Q.ox)*.2;Q.oy+=(dy/d*s*Q.e.ry*.6-Q.oy)*.2;
    setEye(Q,Q.p,bl_)});
  // head turns toward the cursor, and vibrates when the sense is strong
  hx+=(cl((mx-fx)/420,-1,1)-hx)*.12;hy+=(cl((my-fy)/420,-1,1)-hy)*.12;
  const f=Math.floor(t/40),sh=!reduced&&I>.5?(I-.5)*6:0,jolt=b?1+.05*(1-(t-burst)/700):1;
  head.style.transform='perspective(800px) rotateY('+hx*8+'deg) rotateX('+-hy*6+'deg) translate('+(hx*6+(h(1,f)-.5)*sh)+'px,'+(hy*4+(h(2,f)-.5)*sh)+'px) scale('+jolt+')';
  // tingle bolts: more of them appear the closer you get, all of them at max
  T.bolts.forEach((o,k)=>{const el=B[k],th=(k+.6)/7.4,li=sm(th-.12,th,I);
    if(li<.01){el.style.opacity=0;return}
    const dx=(o.cx-T.fc[0])*r.width,dy=(o.cy-T.fc[1])*r.height,n=Math.hypot(dx,dy)||1,j=h(k,f),j2=h(k+9,f);
    const off=li*(4+I*I*14)*(.55+.45*Math.sin(t/60+k*2)),sc=(.8+.25*li)*(b?1+.25*(1-(t-burst)/700):1);
    el.style.opacity=I>.9?.75+.25*j2:li;
    el.style.transform='translate('+(dx/n*off+(j-.5)*I*8)+'px,'+(dy/n*off+(j2-.5)*I*8)+'px) rotate('+(j-.5)*I*14+'deg) scale('+sc+')'});
  spk.style.setProperty('--i',reduced?'0':I.toFixed(3));
}
requestAnimationFrame(loop);
})();

</script>
</body>
